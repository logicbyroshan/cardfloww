<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 380" width="100%" height="100%">
  <defs>
    <linearGradient id="rfidUltraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="85%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011812"/>
    </linearGradient>
    <filter id="rfidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="160" height="380" rx="10" fill="url(#rfidUltraGrad)" stroke="#10b981" stroke-width="1.8"/>
  <circle cx="140" cy="35" r="55" fill="#10b981" opacity="0.15"/>
  <circle cx="20" cy="345" r="45" fill="#34d399" opacity="0.08"/>

  <!-- Top Badge -->
  <rect x="10" y="14" width="140" height="20" rx="4" fill="rgba(16, 185, 129, 0.35)"/>
  <text x="80" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#6ee7b7" text-anchor="middle" letter-spacing="0.5">IOT HARDWARE</text>

  <!-- Central Icon Box -->
  <g transform="translate(52, 46)">
    <rect width="56" height="56" rx="14" fill="rgba(16, 185, 129, 0.25)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" filter="url(#rfidShadow)"/>
    <!-- Wifi / RFID Icon -->
    <path d="M16 23 A 16 16 0 0 1 40 23" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M21 28 A 9 9 0 0 1 35 28" stroke="#6ee7b7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="28" cy="35" r="3" fill="#34d399"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#rfidShadow)">RFID Gate Readers</text>
  <text x="80" y="138" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">Tap Gate Attendance</text>

  <!-- Features Box -->
  <rect x="10" y="152" width="140" height="170" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <g transform="translate(18, 174)">
    <circle cx="4" cy="0" r="3" fill="#34d399"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Instant RFID &amp; NFC Tap</text>
  </g>
  <g transform="translate(18, 198)">
    <circle cx="4" cy="0" r="3" fill="#34d399"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Real-Time Cloud Logging</text>
  </g>
  <g transform="translate(18, 222)">
    <circle cx="4" cy="0" r="3" fill="#34d399"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Instant Parent SMS Alerts</text>
  </g>
  <g transform="translate(18, 246)">
    <circle cx="4" cy="0" r="3" fill="#34d399"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Plug &amp; Play USB / WiFi</text>
  </g>
  <g transform="translate(18, 270)">
    <circle cx="4" cy="0" r="3" fill="#34d399"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Multi-Gate Sync Support</text>
  </g>
  <g transform="translate(18, 294)">
    <circle cx="4" cy="0" r="3" fill="#34d399"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Zero-Latency Scanning</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(10, 334)">
    <rect width="140" height="32" rx="7" fill="#059669" filter="url(#rfidShadow)"/>
    <text x="62" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">Get Hardware</text>
    <path d="M118 13 L125 16.5 L118 20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
