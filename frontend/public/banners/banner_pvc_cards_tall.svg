<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pvcTallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="pvcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="160" height="260" rx="10" fill="url(#pvcTallGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="140" cy="25" r="45" fill="#3b82f6" opacity="0.15"/>
  <circle cx="15" cy="240" r="35" fill="#60a5fa" opacity="0.08"/>

  <!-- Top Badge -->
  <rect x="10" y="12" width="140" height="18" rx="4" fill="rgba(59, 130, 246, 0.3)"/>
  <text x="80" y="24" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#93c5fd" text-anchor="middle" letter-spacing="0.4">SUPPLIES &amp; ACCESSORIES</text>

  <!-- Central Icon Box -->
  <g transform="translate(56, 38)">
    <rect width="48" height="48" rx="12" fill="rgba(59, 130, 246, 0.25)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" filter="url(#pvcShadow)"/>
    <!-- Card Icon -->
    <rect x="12" y="15" width="24" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="12" y1="21" x2="36" y2="21" stroke="#60a5fa" stroke-width="1.8"/>
    <circle cx="24" cy="11" r="2.5" fill="#93c5fd"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="103" font-family="'Inter', sans-serif" font-size="12.5" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#pvcShadow)">PVC Cards &amp; Reels</text>
  <text x="80" y="117" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#93c5fd" text-anchor="middle">Premium ID Accessories</text>

  <!-- Features Box -->
  <rect x="10" y="128" width="140" height="78" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.8"/>
  
  <g transform="translate(16, 144)">
    <circle cx="4" cy="0" r="2.5" fill="#60a5fa"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#bfdbfe">Blank PVC CR80 Cards</text>
  </g>
  <g transform="translate(16, 162)">
    <circle cx="4" cy="0" r="2.5" fill="#60a5fa"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#bfdbfe">Custom Satin Lanyards</text>
  </g>
  <g transform="translate(16, 180)">
    <circle cx="4" cy="0" r="2.5" fill="#60a5fa"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#bfdbfe">Retractable Badge Reels</text>
  </g>
  <g transform="translate(16, 198)">
    <circle cx="4" cy="0" r="2.5" fill="#60a5fa"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#bfdbfe">Bulk Wholesale Pricing</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(10, 214)">
    <rect width="140" height="28" rx="6" fill="#2563eb" filter="url(#pvcShadow)"/>
    <text x="62" y="18" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">View Catalog</text>
    <path d="M116 11 L122 14 L116 17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
