<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 380" width="100%" height="100%">
  <defs>
    <linearGradient id="printUltraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#083344"/>
      <stop offset="85%" stop-color="#041f2d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="printShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="160" height="380" rx="10" fill="url(#printUltraGrad)" stroke="#06b6d4" stroke-width="1.8"/>
  <circle cx="140" cy="35" r="55" fill="#06b6d4" opacity="0.15"/>
  <circle cx="20" cy="345" r="45" fill="#22d3ee" opacity="0.08"/>

  <!-- Top Badge -->
  <rect x="10" y="14" width="140" height="20" rx="4" fill="rgba(6, 182, 212, 0.35)"/>
  <text x="80" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#67e8f9" text-anchor="middle" letter-spacing="0.5">PRINTING HARDWARE</text>

  <!-- Central Icon Box -->
  <g transform="translate(52, 46)">
    <rect width="56" height="56" rx="14" fill="rgba(6, 182, 212, 0.25)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" filter="url(#printShadow)"/>
    <!-- Printer Icon -->
    <rect x="13" y="18" width="30" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M19 18 V12 H37 V18" stroke="#67e8f9" stroke-width="2" fill="none"/>
    <rect x="19" y="29" width="18" height="10" fill="#22d3ee"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#printShadow)">Dual-Sided Printers</text>
  <text x="80" y="138" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#67e8f9" text-anchor="middle">300 DPI Thermal Badges</text>

  <!-- Features Box -->
  <rect x="10" y="152" width="140" height="170" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <g transform="translate(18, 174)">
    <circle cx="4" cy="0" r="3" fill="#22d3ee"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Auto Duplex Dual-Sided</text>
  </g>
  <g transform="translate(18, 198)">
    <circle cx="4" cy="0" r="3" fill="#22d3ee"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">140+ Cards / Hour Speed</text>
  </g>
  <g transform="translate(18, 222)">
    <circle cx="4" cy="0" r="3" fill="#22d3ee"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Direct USB &amp; LAN Network</text>
  </g>
  <g transform="translate(18, 246)">
    <circle cx="4" cy="0" r="3" fill="#22d3ee"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Edge-to-Edge Color Print</text>
  </g>
  <g transform="translate(18, 270)">
    <circle cx="4" cy="0" r="3" fill="#22d3ee"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Smart Ribbon Auto-Detect</text>
  </g>
  <g transform="translate(18, 294)">
    <circle cx="4" cy="0" r="3" fill="#22d3ee"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">2-Year Official Warranty</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(10, 334)">
    <rect width="140" height="32" rx="7" fill="#0891b2" filter="url(#printShadow)"/>
    <text x="62" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">Explore Models</text>
    <path d="M118 13 L125 16.5 L118 20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
