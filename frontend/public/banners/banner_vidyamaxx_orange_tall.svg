<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vmUltraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#c2410c"/>
      <stop offset="80%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="vmBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="vmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="160" height="380" rx="10" fill="url(#vmUltraGrad)" stroke="#f97316" stroke-width="1.8"/>
  
  <!-- Decorative Ambient Circles -->
  <circle cx="140" cy="40" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="20" cy="340" r="50" fill="#ffffff" opacity="0.06"/>
  <circle cx="135" cy="240" r="35" fill="#fb923c" opacity="0.15"/>

  <!-- Top Badge -->
  <rect x="10" y="14" width="140" height="20" rx="4" fill="rgba(0, 0, 0, 0.4)"/>
  <text x="80" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#fed7aa" text-anchor="middle" letter-spacing="0.5">⭐ OUR SCHOOL SOFTWARE</text>

  <!-- Central Icon Emblem Box -->
  <g transform="translate(52, 46)">
    <rect width="56" height="56" rx="14" fill="rgba(255, 255, 255, 0.22)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" filter="url(#vmShadow)"/>
    <!-- Graduation Cap -->
    <path d="M28 15 L10 24 L28 33 L46 24 Z" fill="#ffffff"/>
    <path d="M17 28 V38 C17 43 39 43 39 38 V28" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M43 25 V37" stroke="#fed7aa" stroke-width="2" stroke-linecap="round"/>
    <circle cx="43" cy="38" r="2.2" fill="#fed7aa"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#vmShadow)">VidyaMaxx ERP</text>
  <text x="80" y="138" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#fed7aa" text-anchor="middle">School Management Suite</text>

  <!-- Feature Highlights Box -->
  <rect x="10" y="152" width="140" height="170" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <g transform="translate(18, 174)">
    <circle cx="4" cy="0" r="3" fill="#fb923c"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Student Admissions</text>
  </g>
  <g transform="translate(18, 198)">
    <circle cx="4" cy="0" r="3" fill="#fb923c"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Fees &amp; Live Invoices</text>
  </g>
  <g transform="translate(18, 222)">
    <circle cx="4" cy="0" r="3" fill="#fb923c"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Live RFID Attendance</text>
  </g>
  <g transform="translate(18, 246)">
    <circle cx="4" cy="0" r="3" fill="#fb923c"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Auto Student ID Sync</text>
  </g>
  <g transform="translate(18, 270)">
    <circle cx="4" cy="0" r="3" fill="#fb923c"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Bus GPS Live Tracking</text>
  </g>
  <g transform="translate(18, 294)">
    <circle cx="4" cy="0" r="3" fill="#fb923c"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Parent Mobile App</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(10, 334)">
    <rect width="140" height="32" rx="7" fill="url(#vmBtnGrad)" filter="url(#vmShadow)"/>
    <text x="62" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#c2410c" text-anchor="middle">Open VidyaMaxx</text>
    <path d="M118 13 L125 16.5 L118 20" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
