<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%">
  <defs>
    <linearGradient id="printGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="60%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="300" height="100" rx="8" fill="url(#printGrad)" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="280" cy="25" r="40" fill="#06b6d4" opacity="0.12"/>
  <circle cx="25" cy="80" r="30" fill="#22d3ee" opacity="0.08"/>

  <!-- Left Icon Box -->
  <rect x="12" y="16" width="36" height="36" rx="8" fill="rgba(6, 182, 212, 0.25)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
  <!-- Printer Icon -->
  <rect x="19" y="24" width="22" height="14" rx="2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M23 24 V20 H37 V24" stroke="#67e8f9" stroke-width="1.5" fill="none"/>
  <rect x="23" y="32" width="14" height="6" fill="#22d3ee"/>

  <!-- Header Badge -->
  <rect x="56" y="14" width="88" height="15" rx="3" fill="rgba(6, 182, 212, 0.3)"/>
  <text x="62" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#67e8f9" letter-spacing="0.5">PRINTING HARDWARE</text>

  <!-- Brand Title -->
  <text x="56" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" filter="url(#glow)">Dual-Sided Card Printers</text>

  <!-- Subtitle -->
  <text x="14" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" fill="#cffafe">300 DPI Sublimation Direct-to-Card Badge Machines</text>

  <!-- Bottom CTA -->
  <g transform="translate(14, 73)">
    <rect width="98" height="19" rx="4" fill="#0891b2" filter="url(#glow)"/>
    <text x="10" y="13" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Explore Models</text>
    <path d="M84 7 L89 10 L84 13" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Pill -->
  <rect x="215" y="73" width="71" height="19" rx="4" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8"/>
  <text x="225" y="86" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#67e8f9">Get Quote ➔</text>
</svg>
