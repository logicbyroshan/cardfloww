<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardFlow - Download the App</title>
  <meta name="description" content="Download the CardFlow mobile app to manage your ID cards on the go." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 20px;
      margin: 0 auto 1.5rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: bold; color: #fff;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    p { color: #9ca3af; margin-bottom: 2rem; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff; padding: 0.875rem 2rem;
      border-radius: 12px; text-decoration: none;
      font-weight: 600; font-size: 1rem;
      margin-bottom: 1rem; width: 100%;
    }
    .btn-outline { background: transparent; border: 1px solid #374151; color: #9ca3af; }
    .note { font-size: 0.8rem; color: #6b7280; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">CF</div>
    <h1>CardFlow</h1>
    <p>Download the CardFlow app to manage and track ID cards on the go.</p>
    <a href="https://play.google.com/store/apps/details?id=in.cardflow.app" class="btn">Download for Android</a>
    <a href="https://cardflow.in" class="btn btn-outline">Open Web Portal</a>
    <p class="note">CardFlow ID Card Management System</p>
  </div>
</body>
</html>
