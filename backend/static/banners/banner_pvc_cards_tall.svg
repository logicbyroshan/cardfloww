<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 380" width="100%" height="100%">
  <defs>
    <linearGradient id="pvcUltraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="pvcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="160" height="380" rx="10" fill="url(#pvcUltraGrad)" stroke="#3b82f6" stroke-width="1.8"/>
  <circle cx="140" cy="35" r="55" fill="#3b82f6" opacity="0.15"/>
  <circle cx="20" cy="345" r="45" fill="#60a5fa" opacity="0.08"/>

  <!-- Top Badge -->
  <rect x="10" y="14" width="140" height="20" rx="4" fill="rgba(59, 130, 246, 0.35)"/>
  <text x="80" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#93c5fd" text-anchor="middle" letter-spacing="0.5">SUPPLIES &amp; ACCESSORIES</text>

  <!-- Central Icon Box -->
  <g transform="translate(52, 46)">
    <rect width="56" height="56" rx="14" fill="rgba(59, 130, 246, 0.25)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" filter="url(#pvcShadow)"/>
    <!-- Card Icon -->
    <rect x="14" y="17" width="28" height="22" rx="3.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <line x1="14" y1="24" x2="42" y2="24" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="28" cy="13" r="3" fill="#93c5fd"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#pvcShadow)">PVC Cards &amp; Reels</text>
  <text x="80" y="138" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#93c5fd" text-anchor="middle">Premium ID Accessories</text>

  <!-- Features Box -->
  <rect x="10" y="152" width="140" height="170" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <g transform="translate(18, 174)">
    <circle cx="4" cy="0" r="3" fill="#60a5fa"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Blank CR80 PVC Cards</text>
  </g>
  <g transform="translate(18, 198)">
    <circle cx="4" cy="0" r="3" fill="#60a5fa"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Custom Satin Lanyards</text>
  </g>
  <g transform="translate(18, 222)">
    <circle cx="4" cy="0" r="3" fill="#60a5fa"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Retractable Badge Reels</text>
  </g>
  <g transform="translate(18, 246)">
    <circle cx="4" cy="0" r="3" fill="#60a5fa"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Multi-Color Gripper Clips</text>
  </g>
  <g transform="translate(18, 270)">
    <circle cx="4" cy="0" r="3" fill="#60a5fa"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Direct Factory Dispatch</text>
  </g>
  <g transform="translate(18, 294)">
    <circle cx="4" cy="0" r="3" fill="#60a5fa"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Bulk Wholesale Pricing</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(10, 334)">
    <rect width="140" height="32" rx="7" fill="#2563eb" filter="url(#pvcShadow)"/>
    <text x="62" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">View Catalog</text>
    <path d="M118 13 L125 16.5 L118 20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
