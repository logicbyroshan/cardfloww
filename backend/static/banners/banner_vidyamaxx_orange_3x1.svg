<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="300" height="100" rx="8" fill="url(#vmGrad)" stroke="#f97316" stroke-width="1.5"/>
  
  <!-- Subtle decorative ambient circles -->
  <circle cx="280" cy="15" r="45" fill="#ffffff" opacity="0.06"/>
  <circle cx="20" cy="90" r="35" fill="#ffffff" opacity="0.05"/>
  <circle cx="260" cy="85" r="25" fill="#fb923c" opacity="0.15"/>

  <!-- Left Emblem Box -->
  <rect x="12" y="16" width="36" height="36" rx="8" fill="rgba(255, 255, 255, 0.18)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <!-- Graduation Cap Icon -->
  <path d="M30 22 L18 28 L30 34 L42 28 Z" fill="#ffffff"/>
  <path d="M22 30.5 V37 C22 40 38 40 38 37 V30.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M40 29 V36" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="37" r="1.5" fill="#fed7aa"/>

  <!-- Header Badge -->
  <rect x="56" y="14" width="132" height="15" rx="3" fill="rgba(0, 0, 0, 0.3)"/>
  <text x="62" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#fed7aa" letter-spacing="0.5">⭐ OUR SCHOOL SOFTWARE</text>

  <!-- Brand Title -->
  <text x="56" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" filter="url(#glow)">VidyaMaxx ERP</text>

  <!-- Subtitle / Tagline -->
  <text x="14" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" fill="#ffedd5">Complete School &amp; Campus ERP • Fees, Attendance &amp; Parent App</text>

  <!-- Bottom Bar: CTA Button -->
  <g transform="translate(14, 73)">
    <rect width="102" height="19" rx="4" fill="url(#btnGrad)" filter="url(#glow)"/>
    <text x="10" y="13" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#c2410c">Open VidyaMaxx</text>
    <path d="M88 7 L93 10 L88 13" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Pill -->
  <rect x="210" y="73" width="76" height="19" rx="4" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.8"/>
  <text x="220" y="86" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#fed7aa">Live Demo ➔</text>
</svg>
