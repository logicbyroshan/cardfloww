<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="100%" height="100%">
  <defs>
    <linearGradient id="printTallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="60%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="printShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="160" height="260" rx="10" fill="url(#printTallGrad)" stroke="#06b6d4" stroke-width="1.5"/>
  <circle cx="140" cy="25" r="45" fill="#06b6d4" opacity="0.15"/>
  <circle cx="15" cy="240" r="35" fill="#22d3ee" opacity="0.08"/>

  <!-- Top Badge -->
  <rect x="10" y="12" width="140" height="18" rx="4" fill="rgba(6, 182, 212, 0.3)"/>
  <text x="80" y="24" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#67e8f9" text-anchor="middle" letter-spacing="0.4">PRINTING HARDWARE</text>

  <!-- Central Icon Box -->
  <g transform="translate(56, 38)">
    <rect width="48" height="48" rx="12" fill="rgba(6, 182, 212, 0.25)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" filter="url(#printShadow)"/>
    <!-- Printer Icon -->
    <rect x="11" y="16" width="26" height="16" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M16 16 V11 H32 V16" stroke="#67e8f9" stroke-width="1.8" fill="none"/>
    <rect x="16" y="25" width="16" height="8" fill="#22d3ee"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="103" font-family="'Inter', sans-serif" font-size="12.5" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#printShadow)">Dual-Sided Printers</text>
  <text x="80" y="117" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#67e8f9" text-anchor="middle">300 DPI Thermal Machines</text>

  <!-- Features Box -->
  <rect x="10" y="128" width="140" height="78" rx="6" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="0.8"/>
  
  <g transform="translate(16, 144)">
    <circle cx="4" cy="0" r="2.5" fill="#22d3ee"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#cffafe">Auto Duplex Dual-Sided</text>
  </g>
  <g transform="translate(16, 162)">
    <circle cx="4" cy="0" r="2.5" fill="#22d3ee"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#cffafe">140+ Cards / Hour Speed</text>
  </g>
  <g transform="translate(16, 180)">
    <circle cx="4" cy="0" r="2.5" fill="#22d3ee"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#cffafe">Direct USB &amp; LAN Network</text>
  </g>
  <g transform="translate(16, 198)">
    <circle cx="4" cy="0" r="2.5" fill="#22d3ee"/>
    <text x="12" y="3" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#cffafe">2-Year Official Warranty</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(10, 214)">
    <rect width="140" height="28" rx="6" fill="#0891b2" filter="url(#printShadow)"/>
    <text x="62" y="18" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">Explore Models</text>
    <path d="M116 11 L122 14 L116 17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
