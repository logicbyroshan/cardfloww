<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="60%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="300" height="100" rx="8" fill="url(#aiGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="280" cy="20" r="40" fill="#a855f7" opacity="0.15"/>
  <circle cx="25" cy="85" r="30" fill="#c084fc" opacity="0.08"/>

  <!-- Left Icon Box -->
  <rect x="12" y="16" width="36" height="36" rx="8" fill="rgba(168, 85, 247, 0.25)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
  <!-- Sparkles Icon -->
  <path d="M30 20 L32 26 L38 28 L32 30 L30 36 L28 30 L22 28 L28 26 Z" fill="#ffffff"/>
  <circle cx="23" cy="22" r="1.5" fill="#e9d5ff"/>
  <circle cx="37" cy="34" r="1.2" fill="#e9d5ff"/>

  <!-- Header Badge -->
  <rect x="56" y="14" width="75" height="15" rx="3" fill="rgba(168, 85, 247, 0.3)"/>
  <text x="62" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#d8b4fe" letter-spacing="0.5">AI SMART SUITE</text>

  <!-- Brand Title -->
  <text x="56" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" filter="url(#glow)">AI Face &amp; Photo Studio</text>

  <!-- Subtitle -->
  <text x="14" y="66" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" fill="#e9d5ff">Auto Background Removal, Face Crop &amp; Ultra-Sharp Upscale</text>

  <!-- Bottom CTA -->
  <g transform="translate(14, 73)">
    <rect width="90" height="19" rx="4" fill="#9333ea" filter="url(#glow)"/>
    <text x="10" y="13" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Try AI Suite</text>
    <path d="M76 7 L81 10 L76 13" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Pill -->
  <rect x="215" y="73" width="71" height="19" rx="4" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8"/>
  <text x="225" y="86" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#d8b4fe">1-Click AI ➔</text>
</svg>
