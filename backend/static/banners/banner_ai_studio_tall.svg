  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="122" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#aiShadow)">AI Photo Studio</text>
  <text x="80" y="138" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#d8b4fe" text-anchor="middle">Auto Background &amp; Crop</text>

  <!-- Features Box -->
  <rect x="10" y="152" width="140" height="170" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <g transform="translate(18, 174)">
    <circle cx="4" cy="0" r="3" fill="#c084fc"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">1-Click BG Remover</text>
  </g>
  <g transform="translate(18, 198)">
    <circle cx="4" cy="0" r="3" fill="#c084fc"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Face Alignment &amp; Center</text>
  </g>
  <g transform="translate(18, 222)">
    <circle cx="4" cy="0" r="3" fill="#c084fc"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">4K Ultra HD AI Upscaling</text>
  </g>
  <g transform="translate(18, 246)">
    <circle cx="4" cy="0" r="3" fill="#c084fc"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Batch 1,000+ Photos/Min</text>
  </g>
  <g transform="translate(18, 270)">
    <circle cx="4" cy="0" r="3" fill="#c084fc"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Auto Blur Correction</text>
  </g>
  <g transform="translate(18, 294)">
    <circle cx="4" cy="0" r="3" fill="#c084fc"/>
    <text x="14" y="3.5" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff">Zero-Manual Crop</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(10, 334)">
    <rect width="140" height="32" rx="7" fill="#9333ea" filter="url(#aiShadow)"/>
    <text x="62" y="21" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" text-anchor="middle">Try AI Suite</text>
    <path d="M118 13 L125 16.5 L118 20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
