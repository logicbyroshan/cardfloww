<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aiUltraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="85%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="aiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="160" height="380" rx="10" fill="url(#aiUltraGrad)" stroke="#a855f7" stroke-width="1.8"/>
  <circle cx="140" cy="35" r="55" fill="#a855f7" opacity="0.15"/>
  <circle cx="20" cy="345" r="45" fill="#c084fc" opacity="0.08"/>

  <!-- Top Badge -->
  <rect x="10" y="14" width="140" height="20" rx="4" fill="rgba(168, 85, 247, 0.35)"/>
  <text x="80" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="900" fill="#d8b4fe" text-anchor="middle" letter-spacing="0.5">AI SMART SUITE</text>

  <!-- Central Icon Box -->
  <g transform="translate(52, 46)">
    <rect width="56" height="56" rx="14" fill="rgba(168, 85, 247, 0.25)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" filter="url(#aiShadow)"/>
    <!-- Sparkles Icon -->
    <path d="M28 12 L30 22 L40 25 L30 28 L28 38 L26 28 L16 25 L26 22 Z" fill="#ffffff"/>
    <circle cx="17" cy="15" r="2.5" fill="#e9d5ff"/>
